# Jolpica ingestion from GitHub Actions (D-40). Jolpica limits by IP and sees every Cloudflare Worker behind
# one shared address, so this job runs the ingestion code (workers/ingest/runner) from a GitHub runner and
# writes to D1 through Cloudflare's REST API. OpenF1's post-race analysis stays in the paddock-ingest Worker.
# GitHub's scheduled runs can start a few minutes late; every task is idempotent.
name: ingest

on:
  schedule:
    - cron: "*/15 * * * *" # recent sessions and a slice of the history
    - cron: "0 4 * * *" # the season's calendar and rounds without a result
    - cron: "0 5 * * 1" # later penalties in the last three races
  workflow_dispatch:
    inputs:
      tasks:
        description: "Tasks, separated by spaces: recent, schedule, corrections, backfill"
        default: "schedule recent backfill"
        required: true

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.CLOUDFLARE_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ingest from Jolpica
        working-directory: workers/ingest
        run: pnpm exec tsx runner/main.ts $TASKS
        env:
          TASKS: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.tasks
            || github.event.schedule == '0 4 * * *' && 'schedule backfill'
            || github.event.schedule == '0 5 * * 1' && 'corrections backfill'
            || 'recent backfill' }}
          # A token limited to this account (D1: Edit is the permission used here; security.md §13).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_INGEST }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
