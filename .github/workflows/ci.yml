# Cada pull request y cada push a main: lint, tipos, tests y build. En los PR, además, despliegue al entorno
# de preview (stack.md §12, D-18), solo si la variable del repositorio CLOUDFLARE_READY vale "true".
# Acciones fijadas por SHA completo; permisos mínimos (seguridad.md §13).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @paddock/web build:worker

  preview:
    needs: check
    # Los PR de forks no reciben secretos (seguridad.md §13).
    # Sin cuenta de Cloudflare configurada (CLOUDFLARE_READY), no se intenta desplegar.
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.CLOUDFLARE_READY == 'true'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migraciones de D1 (preview)
        working-directory: workers/api
        run: pnpm exec wrangler d1 migrations apply paddock-db-preview --remote --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Despliegue al entorno de preview
        run: |
          pnpm --filter @paddock/api exec wrangler deploy --env preview
          pnpm --filter @paddock/ingest exec wrangler deploy --env preview
          pnpm --filter @paddock/web exec opennextjs-cloudflare build
          pnpm --filter @paddock/web exec opennextjs-cloudflare deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Pruebas de extremo a extremo y accesibilidad contra la preview (TRA-46)
        run: |
          pnpm --filter @paddock/e2e exec playwright install --with-deps chromium
          pnpm --filter @paddock/e2e e2e
        env:
          E2E_BASE_URL: ${{ vars.PREVIEW_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Lighthouse CI en móvil (TRA-40, TRA-41)
        run: |
          pnpm dlx @lhci/cli@0.15.1 autorun \
            --collect.url="${{ vars.PREVIEW_URL }}/es" \
            --collect.url="${{ vars.PREVIEW_URL }}/es/standings/2026" \
            --collect.url="${{ vars.PREVIEW_URL }}/es/learn/undercut-overcut"
        env:
          LHCI_EXTRA_HEADERS: '{"CF-Access-Client-Id":"${{ secrets.CF_ACCESS_CLIENT_ID }}","CF-Access-Client-Secret":"${{ secrets.CF_ACCESS_CLIENT_SECRET }}"}'
