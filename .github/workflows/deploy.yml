# Main branch deployment: apply migrations, deploy all three Workers, and run health check (stack.md §12).
# Skips deployment until repository variable CLOUDFLARE_READY is "true".
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_READY == 'true'
    runs-on: ubuntu-latest
    # Secrets restricted to production environment with author approval (security.md §13).
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Apply D1 migrations
        working-directory: workers/api
        run: pnpm exec wrangler d1 migrations apply paddock-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        run: |
          pnpm --filter @paddock/api exec wrangler deploy
          pnpm --filter @paddock/ingest exec wrangler deploy
          pnpm --filter @paddock/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health check
        run: curl --fail --retry 5 --retry-delay 5 --retry-all-errors "${{ vars.SITE_URL }}/api/v1/health"
      - name: Rollback on health check failure
        if: failure()
        run: |
          pnpm --filter @paddock/api exec wrangler rollback --message "deploy ${{ github.sha }} failed health check"
          pnpm --filter @paddock/web exec wrangler rollback --message "deploy ${{ github.sha }} failed health check"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
