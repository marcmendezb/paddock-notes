# Fusión en main: migraciones, despliegue de los tres Workers y comprobación de salud (stack.md §12).
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secretos solo en el entorno production, con aprobación manual del autor (seguridad.md §13).
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Migraciones de D1
        working-directory: workers/api
        run: pnpm exec wrangler d1 migrations apply paddock-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Despliegue
        run: |
          pnpm --filter @paddock/api exec wrangler deploy
          pnpm --filter @paddock/ingest exec wrangler deploy
          pnpm --filter @paddock/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comprobación de salud
        run: curl --fail --retry 5 --retry-delay 5 --retry-all-errors "${{ vars.SITE_URL }}/api/v1/health"
      - name: Reversión si falla la comprobación
        if: failure()
        run: |
          pnpm --filter @paddock/api exec wrangler rollback --message "deploy ${{ github.sha }} falló la comprobación"
          pnpm --filter @paddock/web exec wrangler rollback --message "deploy ${{ github.sha }} falló la comprobación"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
