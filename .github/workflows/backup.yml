# Copia semanal de D1 a R2 (D-15). Miércoles a las 03:00 UTC: la exportación bloquea las consultas
# mientras dura y a esa hora no hay sesiones de F1. El bucket borra las copias a los 90 días.
name: backup

on:
  schedule:
    - cron: "0 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: backup
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exportar y subir
        working-directory: workers/api
        run: |
          file="d1-$(date -u +%Y-%m-%d).sql"
          pnpm exec wrangler d1 export paddock-db --remote --output "$file"
          pnpm exec wrangler r2 object put "paddock-backups/d1/$file" --file "$file" --jurisdiction eu --remote
        env:
          # Token exclusivo de copias: solo D1 de producción y el bucket paddock-backups (seguridad.md §13).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BACKUP }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
