# Weekly backup of D1 (D-15) as a private GitHub Actions artifact, kept 90 days: the free plan has no R2
# bucket for it (D-39). Wednesday at 03:00 UTC: a database export blocks queries while it runs, and no F1
# session is live then.
name: backup

on:
  schedule:
    - cron: "0 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    # Skip execution unless Cloudflare repository variable is configured.
    if: vars.CLOUDFLARE_READY == 'true'
    runs-on: ubuntu-latest
    environment: backup
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export the database
        working-directory: workers/api
        run: pnpm exec wrangler d1 export paddock-db --remote --output "d1-$(date -u +%Y-%m-%d).sql"
        env:
          # Dedicated backup token: production D1 only, read and export (security.md §13).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BACKUP }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d1-backup
          path: workers/api/d1-*.sql
          retention-days: 90
          if-no-files-found: error
