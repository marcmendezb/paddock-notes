packages:
  - apps/*
  - workers/*
  - packages/*
  - e2e

# D-19: no version published less than 14 days ago is installed (in minutes).
# An urgent security patch is added to minimumReleaseAgeExclude and reviewed in the PR.
minimumReleaseAge: 20160

# Install scripts are off except for this list (security.md §12).
onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp

# Security patches for tools' transitive dependencies (pnpm audit, 5 Nov 2026).
# Every fixed version already meets D-19's 14 days.
overrides:
  undici@>=7.0.0 <7.30.1: ^7.30.1
  zod@>=4.0.0 <4.6.6: ^4.6.6
  glob@>=10.2.0 <10.5.0: ^10.5.0
