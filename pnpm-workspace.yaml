packages:
  - apps/*
  - workers/*
  - packages/*
  - e2e

# D-19: no se instala ninguna versión publicada hace menos de 14 días (en minutos).
# Un parche de seguridad urgente se añade a minimumReleaseAgeExclude y se revisa en el PR.
minimumReleaseAge: 20160

# Scripts de instalación desactivados salvo en esta lista (seguridad.md §12).
onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp

# Parches de seguridad en dependencias transitivas de herramientas (pnpm audit, 5 nov 2026).
# Todas las versiones corregidas cumplen ya los 14 días de D-19.
overrides:
  undici@>=7.0.0 <7.30.1: ^7.30.1
  zod@>=4.0.0 <4.6.6: ^4.6.6
  glob@>=10.2.0 <10.5.0: ^10.5.0
